<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks for Giving · 낙농 30초 진단 · 고민을 고르면 맞는 전문가·제품까지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
:root{
  --ink:#1f2a24; --sub:#5d6b63; --line:#e4e2da; --bg:#faf8f3; --card:#fff;
  --brand:#2d5f8a; --brand2:#e8f0f7; --mall:#2f5d46; --mall2:#e9f0ea; --accent:#c8862b; --accent2:#fbf1e2;
  --good:#2f7d4f; --mid:#c8862b; --bad:#b5463a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header .wrap{display:flex;align-items:center;gap:10px;height:58px}
.logo{font-weight:800;font-size:18px;color:var(--brand);cursor:pointer}
.logo span{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent2);padding:3px 8px;border-radius:20px;margin-left:6px}
.hl{margin-left:auto;display:flex;gap:6px}
.hl a{font-size:13px;font-weight:700;padding:7px 11px;border-radius:9px;background:var(--brand2);color:var(--brand)}
.hl a.m{background:var(--mall2);color:var(--mall)}

/* 가로 진행 표시 */
.prog{display:flex;align-items:center;gap:0;margin:16px 0 6px;overflow-x:auto}
.pg{display:flex;align-items:center;flex:1;min-width:84px}
.pg div{flex:1;text-align:center;font-size:12px;font-weight:800;color:#a8a69d;padding:7px 4px;border-radius:9px;background:#f0eee7;white-space:nowrap}
.pg.on div{background:var(--brand);color:#fff}
.pg.done div{background:var(--brand2);color:var(--brand)}
.pg i{font-style:normal;color:#c5c2b8;padding:0 3px;font-weight:900}

/* A 고민 고르기 */
.hero{padding:22px 0 6px}
.hero h1{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.3}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero p{color:var(--sub);margin-top:6px}
.trust{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.trust div{font-size:13px;background:#fff;border:1px solid var(--line);padding:5px 10px;border-radius:20px;color:var(--sub)}
.trust b{color:var(--ink)}
.worries{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.wbtn{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px 16px;text-align:left;transition:.12s;min-height:118px;display:flex;flex-direction:column;gap:4px}
.wbtn:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 8px 22px rgba(45,95,138,.1)}
.wbtn .ic{font-size:30px;line-height:1}
.wbtn b{font-size:17px;margin-top:4px}
.wbtn small{color:var(--sub);font-size:13px}
.wbtn.done{border-color:var(--good)}
.wbtn.done::after{content:"✓ 진단 완료";font-size:12px;font-weight:800;color:var(--good)}
.alt{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.alt a,.alt button{display:flex;align-items:center;gap:12px;background:var(--brand2);border:0;border-radius:14px;padding:14px 16px;text-align:left;color:var(--brand)}
.alt .ic{font-size:24px}
.alt b{display:block;font-size:15px}
.alt small{font-size:12px;color:var(--sub)}

/* B 한 문항씩 */
.qbox{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;margin-top:12px;max-width:680px;margin-left:auto;margin-right:auto;box-shadow:0 6px 24px rgba(45,95,138,.06)}
.qbox .tag{font-size:13px;font-weight:800;color:var(--brand)}
.qbar{height:6px;background:#eee;border-radius:9px;margin:10px 0 18px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--brand);transition:.25s}
.qbox h2{font-size:22px;font-weight:800;line-height:1.35}
.qbox .help{color:var(--sub);font-size:14px;margin-top:4px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{background:#fcfbf8;border:2px solid var(--line);border-radius:14px;padding:15px 16px;font-size:17px;font-weight:600;text-align:left}
.opt:hover{border-color:var(--brand);background:var(--brand2)}
.opt.sel{border-color:var(--brand);background:var(--brand2);color:var(--brand)}
.opt.na{background:transparent;border-style:dashed;color:var(--sub);font-size:15px}
.qnav{display:flex;justify-content:space-between;margin-top:16px}
.lnk{background:none;border:0;color:var(--sub);font-size:14px;font-weight:700;padding:6px}

/* C 결과 */
.rtop{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap}
.score{background:var(--brand);color:#fff;border-radius:18px;padding:18px 22px;min-width:210px}
.score .s{font-size:48px;font-weight:900;line-height:1.05}
.score small{opacity:.9}
.areas{flex:1;display:flex;gap:10px;overflow-x:auto}
.ar{flex:1;min-width:118px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.ar .n{font-size:13px;font-weight:800;color:var(--sub)}
.ar .v{font-size:26px;font-weight:900}
.ar .x{font-size:12px;color:var(--sub)}
.ar.add{border-style:dashed;display:flex;align-items:center;justify-content:center;color:var(--brand);font-weight:800;cursor:pointer;background:transparent}
.bar{height:6px;background:#eee;border-radius:9px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%}
.headline{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px;font-size:16px}

.sec{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;flex-wrap:wrap}
.sec h3{font-size:19px;font-weight:800}
.sec p{color:var(--sub);font-size:14px}

.weak{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.wk{flex:1;min-width:290px;background:#fff;border:2px solid var(--accent);border-radius:16px;padding:16px}
.wk .h{display:flex;justify-content:space-between;gap:8px}
.wk .h b{font-size:16px}
.wk .st{color:var(--accent);font-weight:900}
.wk .now{font-size:13px;color:var(--sub);margin:3px 0 8px}
.wk .why{font-size:14px;background:var(--accent2);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.wk ol{padding-left:18px;font-size:14px}

/* D 연결: 왼쪽 전문가 / 오른쪽 제품 */
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.col{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.col>h4{font-size:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.col>h4 small{font-size:12px;color:var(--sub);font-weight:600}
.ex{border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.ex .av{width:46px;height:46px;border-radius:50%;background:var(--brand2);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.ex .t{flex:1}
.ex b{font-size:15px}
.ex .d{font-size:13px;color:var(--sub)}
.ex .why{font-size:13px;color:var(--brand);font-weight:700;margin-top:4px}
.ex button{margin-top:8px}
.pd{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.pd .ic{font-size:20px}
.pd .t{flex:1}
.pd b{font-size:15px}
.pd small{display:block;font-size:12px;color:var(--sub)}
.pd .go{font-size:13px;font-weight:800;color:var(--mall);background:var(--mall2);padding:6px 10px;border-radius:8px;white-space:nowrap}
.empty{font-size:14px;color:var(--sub);padding:10px 2px}

/* E 가격 사다리 */
.ladder{display:flex;align-items:stretch;overflow-x:auto;padding-bottom:4px}
.lv{flex:1;min-width:210px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column}
.lv.star{border:2px solid var(--accent)}
.lv .k{font-size:12px;font-weight:800;color:var(--brand)}
.lv h4{font-size:16px;margin:2px 0}
.lv .pr{font-size:22px;font-weight:900}
.lv .pr small{font-size:12px;color:var(--accent);font-weight:800;margin-left:4px}
.lv ul{font-size:13px;color:var(--sub);padding-left:16px;margin:6px 0 12px;flex:1}
.lv.back{background:var(--brand);color:#fff;border-color:var(--brand)}
.lv.back .k,.lv.back ul{color:#dbe8f3}
.la{display:flex;align-items:center;color:#c5c2b8;font-weight:900;padding:0 6px}

.btn{border:0;border-radius:11px;padding:12px 18px;font-size:15px;font-weight:800}
.btn.p{background:var(--brand);color:#fff}
.btn.a{background:var(--accent);color:#fff}
.btn.w{background:#fff;color:var(--brand)}
.btn.g{background:#efede6;color:var(--sub)}
.btn.s{padding:8px 12px;font-size:13px;border-radius:9px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

.prov{margin-top:28px;background:var(--mall2);border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.prov .t{flex:1;min-width:220px}
.prov b{font-size:16px;color:var(--mall)}
.prov small{display:block;color:var(--sub);font-size:13px}

.note{font-size:12px;color:var(--sub);margin:24px 0 40px;line-height:1.65}

/* 신청 모달 */
.modal{position:fixed;inset:0;background:rgba(20,30,25,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:20px 20px 0 0;padding:22px;max-width:520px;width:100%;max-height:92vh;overflow:auto}
@media(min-width:700px){.modal{align-items:center}.mbox{border-radius:20px}}
.mbox h3{font-size:19px}
.mbox .s{color:var(--sub);font-size:14px;margin:4px 0 12px}
.mbox label{display:block;font-size:14px;font-weight:700;margin:10px 0 4px}
.mbox input,.mbox select,.mbox textarea{width:100%;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px}
.mbox .agree{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--sub);font-weight:500;margin-top:12px}
.mbox .agree input{width:auto;margin-top:3px}
.mbox .ok{display:none;margin-top:12px;padding:12px;border-radius:10px;background:var(--mall2);color:var(--mall);font-weight:700}
.hide{display:none}

@media(max-width:820px){.worries{grid-template-columns:1fr 1fr}.match{grid-template-columns:1fr}.alt{grid-template-columns:1fr}}
@media(max-width:480px){.hero h1{font-size:23px}.wbtn{min-height:104px;padding:14px}.wbtn b{font-size:16px}.score{width:100%}.qbox{padding:18px}.qbox h2{font-size:20px}.hl a.d{display:none}}
/* Thanks for Giving — 헤더 전용 스타일 */
@font-face{font-family:"Tilt Neon";src:url("tilt-neon.woff2") format("woff2")}

.tfg-header{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;
  padding:14px 20px;background:linear-gradient(90deg,#1E3466 0%,#2F5596 55%,#6E9BD1 100%)}

/* 금빛 별 */
.tfg-star{position:absolute;width:4px;height:4px;border-radius:50%;background:#F5D06F;
  box-shadow:0 0 6px 2px rgba(245,208,111,.75);animation:tfg-twinkle 2.4s ease-in-out infinite}
.tfg-star.sm{width:3px;height:3px}
@keyframes tfg-twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}

/* 로고: 금빛 소 + 네온 YULDANG */
.tfg-brand{position:relative;display:flex;align-items:center;gap:14px}
.tfg-logo{display:flex;flex-direction:column;align-items:center;gap:3px}
.tfg-logo img{height:48px;filter:drop-shadow(0 0 5px rgba(245,208,111,.55))}
.tfg-logo span{font-family:"Tilt Neon",sans-serif;font-size:12px;letter-spacing:2.5px;color:#F3E6C4;
  text-shadow:0 0 3px rgba(245,208,111,.55),0 0 7px rgba(245,208,111,.25);animation:tfg-neon 6s ease-in-out infinite}
@keyframes tfg-neon{0%,100%{opacity:.9}50%{opacity:1}}

/* 황금 반짝이 제목 */
.tfg-title{font-family:Georgia,"Times New Roman",serif;font-size:28px;font-weight:500;letter-spacing:.5px;margin:0;
  background:linear-gradient(100deg,#B8860B 0%,#F5D06F 25%,#FFF6C8 45%,#F5D06F 60%,#B8860B 100%);
  background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 6px rgba(245,208,111,.6));animation:tfg-shine 3.5s linear infinite}
@keyframes tfg-shine{0%{background-position:100% 0}100%{background-position:-150% 0}}

/* 메뉴 */
.tfg-nav{position:relative;display:flex;gap:16px;font-size:13px}
.tfg-nav a{color:#fff;text-decoration:none}
.tfg-menu-btn{display:none;position:relative;background:none;border:none;color:#fff;font-size:22px;cursor:pointer}

/* 휴대폰 */
@media (max-width:600px){
  .tfg-title{font-size:22px}
  .tfg-nav{display:none}
  .tfg-nav.open{display:flex;flex-direction:column;position:absolute;right:16px;top:64px;
    background:#1E3466;padding:12px 16px;border-radius:8px;z-index:10}
  .tfg-menu-btn{display:block}
}
/* 움직임 줄이기 설정을 켠 사용자는 애니메이션 끔 */
@media (prefers-reduced-motion:reduce){.tfg-star,.tfg-title,.tfg-logo span{animation:none}}

/* 카카오톡·전화 상담 */
.consult{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;max-width:560px}
.consult h4{font-size:17px}
.consult .sub{color:var(--sub);font-size:14px;margin:4px 0 14px}
.kbtn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:800;background:#FEE500;color:#191919}
.cbtn{display:block;width:100%;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:#fff;color:var(--brand);border:1.5px solid var(--brand);margin-top:10px}
.kfab{position:fixed;right:16px;bottom:18px;z-index:40;background:#FEE500;color:#191919;border:0;border-radius:30px;padding:12px 16px;font-size:15px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.ktoast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
.ktoast.show{opacity:1}
/* 상담·문의 센터 (벤치마킹: 채널톡 운영시간·FAQ, 짧은 양식) */
.cs{margin-top:26px}
.cs-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cs-hd h3{font-size:20px;font-weight:800}
.cs-hd .st{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px}
.cs-hd .st i{width:8px;height:8px;border-radius:50%;background:#2f7d4f;display:inline-block}
.cs-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.cso{border-radius:16px;padding:16px;text-align:left;border:1.5px solid var(--line);background:#fff;display:flex;flex-direction:column;gap:4px}
.cso .tx{display:flex;flex-direction:column;gap:2px}
.cso b{font-size:17px}
.cso small{font-size:13px;color:var(--sub)}
.cso .ic{font-size:24px}
.cso.k{background:#FEE500;border-color:#FEE500}
.cso.k small{color:#5a5000}
.cso .tag{align-self:flex-start;font-size:11px;font-weight:800;background:#191919;color:#FEE500;padding:2px 7px;border-radius:6px;margin-top:4px}
.csflow{display:flex;align-items:stretch;overflow-x:auto;margin-top:14px;padding-bottom:4px}
.csf{flex:1;min-width:132px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.csf .k{font-size:12px;font-weight:800;color:var(--brand)}
.csf b{display:block;font-size:14px}
.csf small{font-size:12px;color:var(--sub)}
.csf.back{background:var(--brand);border-color:var(--brand);color:#fff}
.csf.back .k,.csf.back small{color:#dbe8f3}
.csa{display:flex;align-items:center;color:#c5c2b8;font-weight:900;padding:0 5px}
.faq{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.faq details{border-bottom:1px solid var(--line)}
.faq details:last-child{border-bottom:0}
.faq summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:10px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--brand);font-weight:900}
.faq details[open] summary::after{content:"−"}
.faq p{padding:0 16px 14px;font-size:14px;color:var(--sub)}
.req{color:var(--bad);margin-left:2px}
.opt-l{font-weight:500;color:var(--sub);font-size:12px;margin-left:4px}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.chipsel label{margin:0!important;display:inline-flex!important;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:20px;padding:6px 11px;font-size:14px;font-weight:600!important;cursor:pointer}
.chipsel input{width:auto!important;display:none}
.chipsel label:has(input:checked){border-color:var(--brand);background:var(--brand2);color:var(--brand)}
@media(max-width:640px){.cs-opts{grid-template-columns:1fr}.cso{flex-direction:row;align-items:center;gap:12px}.cso .tx{flex:1}.cso .tag{margin:0}}
</style>
</head>
<body>

<header class="tfg-header">
  <span class="tfg-star" style="top:12px;left:44%"></span>
  <span class="tfg-star sm" style="top:36px;left:56%;animation-delay:.7s"></span>
  <span class="tfg-star" style="top:16px;left:66%;animation-delay:1.4s"></span>
  <span class="tfg-star sm" style="top:52px;left:50%;animation-delay:.3s"></span>
  <span class="tfg-star sm" style="top:8px;left:80%;animation-delay:1.9s"></span>
  <div class="tfg-brand">
    <div class="tfg-logo"><img src="logo-yuldang-cow-gold.png" alt="율당 금빛 소 로고"><span>YULDANG</span></div>
    <h1 class="tfg-title">Thanks for Giving</h1>
  </div>
  <button class="tfg-menu-btn" aria-label="메뉴" onclick="document.querySelector('.tfg-nav').classList.toggle('open')">☰</button>
  <nav class="tfg-nav"><a href="./">간이 진단</a><a href="detail.html">정밀진단</a><a href="#" id="tfgPro">전문가 등록</a><a href="../">축산몰</a></nav>
</header>
<header><div class="wrap">
  <div class="logo" id="home">🩺 낙농 진단<span>30초 무료</span></div>
  <div class="hl"><a class="d" href="detail.html">정밀진단</a><a class="m" href="../">🛒 축산몰</a></div>
</div></header>

<main class="wrap">
  <div class="prog" id="prog"></div>
  <div id="view"></div>
  <p class="note">
    ※ 진단 기준(점수 구간)과 리포트 가격은 서비스 준비 단계의 <b>가정값</b>입니다. 목장 규모·사양 방식에 따라 달라질 수 있으며, 정확한 판단은 실제 기록(검정성적·납유 명세)으로 확인합니다.<br>
    ※ 답변은 이 기기에만 저장되고, 신청서를 보낼 때만 함께 전달됩니다.
  </p>
</main>

<button class="kfab" id="kfab">💬 카톡 문의</button>
<div class="ktoast" id="ktoast"></div>

<!-- 신청 모달 (Netlify Forms) -->
<div class="modal" id="modal"><div class="mbox">
  <h3 id="mT">신청</h3><p class="s" id="mS"></p>

 '수의사 (유방염·질병)':['🩺','유방염 원인균, 치료·예방 계획'],'사양·영양 (TMR·사료)':['🌾','TMR 설계, 조사료 분석, 사료비'],
 '송아지·육성우':['🍼','초유·포유·보온, 육성 성장 관리'],'경영·재무':['📊','현금흐름, 상환 조정, 지원사업']};
const PRICE=[ /* 가정값: 정식 가격 확정 전 */
 {k:'무료',h:'전문가 상담 요청',p:'0원',l:['요청 1번이면 맞는 전문가가 연락','비교하고 고르기'],b:'상담 요청',t:'match'},
 {k:'★ 1단계',h:'간이 원인분석 리포트',p:'9,900원',l:['오늘 답변 + 체크리스트','약점별 원인·할 일'],b:'리포트 신청',t:'lite',star:1},
 {k:'★ 2단계',h:'정밀 컨설팅 보고서',p:'190,000원',l:['검정성적·납유 명세 분석','3개월 개선 계획 + 방문'],b:'보고서 신청',t:'full',star:1}];

let S={step:'home',w:null,qi:0,ans:{}};
try{ const s=JSON.parse(localStorage.getItem('dx_quick_v1')||'null'); if(s&&s.ans) S.ans=s.ans; }catch(e){}
const save=()=>{ try{ localStorage.setItem('dx_quick_v1',JSON.stringify({ans:S.ans})); }catch(e){} };
const $=s=>document.querySelector(s);
const col=s=>s>=80?'var(--good)':s>=50?'var(--mid)':'var(--bad)';
const grade=s=>s>=80?'양호':s>=50?'보통 · 개선 여지':'주의 · 우선 개선';
const done=w=>w.qs.some(q=>S.ans[q.id]!=null&&S.ans[q.id]!=='na');
function areaScore(w){ const v=w.qs.map(q=>S.ans[q.id]).filter(x=>x!=null&&x!=='na').map(a=>a.s); return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null; }

function prog(){
  const steps=[['A','고민'],['B','30초 진단'],['C','결과'],['D','연결'],['E','신청']];
  const cur={home:0,q:1,result:2}[S.step]??0;
  $('#prog').innerHTML=steps.map((s,i)=>`<div class="pg ${i===cur?'on':i<cur?'done':''}"><div>${s[0]} · ${s[1]}</div>${i<4?'<i>→</i>':''}</div>`).join('');
}
function render(){ prog(); ({home:vHome,q:vQ,result:vResult})[S.step](); window.scrollTo({top:0,behavior:'smooth'}); }

/* A. 고민 고르기 */
function vHome(){
  const any=W.some(done);
  $('#view').innerHTML=`<section class="hero">
    <h1>어떤 게 <em>제일 고민</em>이세요?</h1>
    <p>하나만 눌러도 됩니다. 버튼으로 4번만 답하면 약한 곳과 맞는 전문가·제품을 바로 보여드려요.</p>
    <div class="trust"><div>⏱ <b>30초</b> · 숫자 몰라도 OK</div><div>💸 진단 <b>무료</b></div><div>🛒 제품은 <b>축산몰 최저가</b>로 연결</div></div>
  </section>
  <div class="worries">${W.map(w=>`<button class="wbtn ${done(w)?'done':''}" data-w="${w.id}"><span class="ic">${w.ic}</span><b>${w.ask}</b><small>${w.name}</small></button>`).join('')}</div>
  <div class="alt">
    ${any?`<button id="seeRes"><span class="ic">📋</span><span><b>지금까지 결과 보기</b><small>${W.filter(done).map(w=>w.name).join(' · ')}</small></span></button>`:
    `<a href="detail.html"><span class="ic">🔢</span><span><b>숫자로 정밀진단</b><small>쿼터·번식·유질·사료·경영 20개 항목</small></span></a>`}
    <button id="photo"><span class="ic">📷</span><span><b>검정성적표 사진으로 진단 요청</b><small>입력 없이 자료만 보내면 분석해 드려요</small></span></button>
  </div>
  ${consultHTML(false)}
  <div class="prov"><div class="t"><b>수의사·인공수정사·컨설턴트·기자재 업체이신가요?</b><small>지역 낙농가의 상담 요청을 받아보세요. 등록은 무료입니다.</small></div><button class="btn w" id="pro">전문가·업체 등록 →</button></div>`;
  document.querySelectorAll('.wbtn').forEach(b=>b.onclick=()=>{ S.w=b.dataset.w; S.qi=0; S.step='q'; render(); });
  const sr=$('#seeRes'); if(sr) sr.onclick=()=>{ S.step='result'; render(); };
  $('#photo').onclick=()=>openReq('photo'); $('#pro').onclick=()=>openReq('pro');
}

/* B. 한 문항씩 */
function vQ(){
  const w=W.find(x=>x.id===S.w), q=w.qs[S.qi], a=S.ans[q.id];
  $('#view').innerHTML=`<div class="qbox">
    <div class="tag">${w.ic} ${w.name} · ${S.qi+1} / ${w.qs.length}</div>
    <div class="qbar"><i style="width:${(S.qi)/w.qs.length*100}%"></i></div>
    <h2>${q.t}</h2>${q.h?`<p class="help">${q.h}</p>`:''}
    <div class="opts">${q.o.map((o,i)=>`<button class="opt ${a&&a!=='na'&&a.i===i?'sel':''}" data-i="${i}">${o[0]}</button>`).join('')}
      <button class="opt na ${a==='na'?'sel':''}" data-i="na">잘 모르겠어요 (건너뛰기)</button></div>
    <div class="qnav"><button class="lnk" id="back">← ${S.qi?'이전 질문':'고민 다시 고르기'}</button>${S.qi===w.qs.length-1?'':`<button class="lnk" id="skipAll">결과 바로 보기 →</button>`}</div>
  </div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const i=b.dataset.i; S.ans[q.id]= i==='na'?'na':{i:+i,s:q.o[+i][1]}; save();
    b.classList.add('sel');
    setTimeout(()=>{ if(S.qi<w.qs.length-1){ S.qi++; vQ(); } else { S.step='result'; render(); } },160);
  });
  $('#back').onclick=()=>{ if(S.qi){ S.qi--; vQ(); } else { S.step='home'; render(); } };
  const sk=$('#skipAll'); if(sk) sk.onclick=()=>{ S.step='result'; render(); };
}

/* C·D·E. 결과 → 연결 → 신청 */
function compute(){
  const areas=W.filter(done).map(w=>({w,s:areaScore(w)}));
  const total=areas.length?Math.round(areas.reduce((a,x)=>a+x.s,0)/areas.length):null;
  const weak=areas.flatMap(x=>x.w.qs.filter(q=>S.ans[q.id]&&S.ans[q.id]!=='na'&&S.ans[q.id].s<80).map(q=>({w:x.w,q,s:S.ans[q.id].s,a:q.o[S.ans[q.id].i][0]}))).sort((p,q)=>p.s-q.s);
  return {areas,total,weak};
}
function vResult(){
  const r=compute();
  if(r.total==null){ $('#view').innerHTML=`<div class="qbox"><h2>답한 문항이 없어요</h2><p class="help">"잘 모르겠어요"만 고르셨네요. 다른 고민을 골라보시거나 검정성적표 사진으로 요청해 주세요.</p><div class="row"><button class="btn p" id="h">고민 다시 고르기</button></div></div>`; $('#h').onclick=()=>{S.step='home';render();}; return; }
  const top=r.weak.slice(0,2);
  const exps=[...new Set((top.length?top:r.areas.map(x=>({w:x.w}))).map(x=>x.w.exp))];
  const prods=[...new Set(top.flatMap(x=>x.q.fix.p))].slice(0,5);
  const left=W.filter(w=>!done(w));
  $('#view').innerHTML=`
  <div class="rtop">
    <div class="score"><small>진단 점수</small><div class="s">${r.total}</div><small>${grade(r.total)}</small></div>
    <div class="areas">${r.areas.map(x=>`<div class="ar"><div class="n">${x.w.ic} ${x.w.name}</div><div class="v" style="color:${col(x.s)}">${x.s}</div><div class="bar"><i style="width:${x.s}%;background:${col(x.s)}"></i></div></div>`).join('')}
      ${left.length?`<div class="ar add" id="more">+ 다른 고민도<br>진단하기</div>`:''}</div>
  </div>
  <div class="headline">${top.length?`★ 가장 먼저 손볼 곳은 <b>${top.map(x=>SHORT[x.q.id]).join('</b>, <b>')}</b>입니다.`:'답하신 항목은 모두 양호합니다. 다른 고민도 진단해 보세요.'}</div>

  ${top.length?`<div class="sec"><h3>★ 우선 손볼 곳</h3><p>왜 중요한지 → 이번 주 할 일</p></div>
  <div class="weak">${top.map(x=>`<div class="wk"><div class="h"><b><span class="st">★</span> ${SHORT[x.q.id]}</b><span style="color:${col(x.s)};font-weight:800">${x.s}점</span></div>
    <div class="now">${x.q.t} → <b>${x.a}</b></div><div class="why">💡 ${x.q.fix.why}</div>
    <ol>${x.q.fix.a.map(t=>`<li>${t}</li>`).join('')}</ol></div>`).join('')}</div>`:''}

  <div class="sec"><h3>D · 맞는 전문가와 제품</h3><p>왼쪽은 사람, 오른쪽은 물건</p></div>
  <div class="match">
    <div class="col"><h4>👤 전문가 연결 <small>요청 1번 → 맞는 분이 연락</small></h4>
      ${exps.map(e=>`<div class="ex"><div class="av">${EXP[e][0]}</div><div class="t"><b>${e}</b><div class="d">${EXP[e][1]}</div>
        <div class="why">✔ 추천 이유: ${(top.find(x=>x.w.exp===e)||{w:{name:''}}).w.name||r.areas[0].w.name} 점수가 낮게 나왔어요</div>
        <button class="btn p s" data-exp="${e}">무료 상담 요청</button></div></div>`).join('')}
    </div>
    <div class="col"><h4>🛒 필요한 제품 <small>축산몰 가격 비교</small></h4>
      ${prods.length?prods.map(p=>`<a class="pd" href="../?q=${encodeURIComponent(p)}"><span class="ic">${(PNAME[p]||[p,'📦'])[1]}</span><span class="t"><b>${(PNAME[p]||[p])[0]}</b><small>업체별 가격·규격 한 번에</small></span><span class="go">최저가 보기</span></a>`).join('')
        :`<div class="empty">이 고민은 제품보다 <b>계획·관리</b>가 먼저입니다. 왼쪽 전문가 상담을 추천해요.</div>`}
      <a class="pd" href="../"><span class="ic">🔍</span><span class="t"><b>축산몰에서 직접 찾기</b><small>낙농 기자재 전체</small></span><span class="go">이동</span></a>
    </div>
  </div>

  ${consultHTML(true)}

  <div class="sec"><h3>E · 더 정확하게</h3><p>무료 상담 → 간이 리포트 → 정밀 보고서 → 다시 진단</p></div>
  <div class="ladder">${PRICE.map((x,i)=>`<div class="lv ${x.star?'star':''}"><div class="k">${x.k}</div><h4>${x.h}</h4><div class="pr">${x.p}${x.p!=='0원'?'<small>가정</small>':''}</div>
      <ul>${x.l.map(t=>`<li>${t}</li>`).join('')}</ul><button class="btn ${x.star?'a':'p'} s" data-req="${x.t}">${x.b}</button></div><div class="la">→</div>`).join('')}
    <div class="lv back"><div class="k">다시 A로</div><h4>3개월 뒤 재진단</h4><div class="pr">무료</div><ul><li>점수 변화로 효과 확인</li><li>알림을 보내드려요</li></ul><button class="btn w s" data-req="remind">알림 신청</button></div>
  </div>
  <div class="row"><button class="btn g" id="home2">← 고민 다시 고르기</button><button class="btn g" id="reset">답변 모두 지우기</button><a class="btn g" href="detail.html">🔢 숫자로 정밀진단</a></div>`;
  const mo=$('#more'); if(mo) mo.onclick=()=>{ S.step='home'; render(); };
  document.querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>openReq('match',b.dataset.exp));
  document.querySelectorAll('[data-req]').forEach(b=>b.onclick=()=>openReq(b.dataset.req,exps[0]));
  $('#home2').onclick=()=>{ S.step='home'; render(); };
  $('#reset').onclick=()=>{ if(confirm('답변을 모두 지울까요?')){ S.ans={}; save(); S.step='home'; render(); } };
}

 match:['👤 무료 전문가 상담 요청','진단 결과를 보고 맞는 전문가가 연락드립니다.',1],
 lite:['📄 간이 원인분석 리포트 신청 (9,900원·가정)','결제 방법과 결과 받는 방법을 연락드려 안내합니다.',0],
 full:['📑 정밀 컨설팅 보고서 신청 (190,000원·가정)','필요한 자료(검정성적·납유 명세)와 일정을 연락드려 안내합니다.',0],
 remind:['🔔 3개월 뒤 재진단 알림','3개월 뒤 문자로 재진단 링크를 보내드립니다.',0],
 photo:['📷 검정성적표 사진으로 진단 요청','연락처를 남기시면 사진 받을 방법(카톡·문자)을 안내드립니다.',0],
 pro:['🤝 전문가·업체 등록','분야와 활동 지역을 남겨주세요. 등록 절차를 안내드립니다.',1]
};
function summary(){
  const r=compute(); if(r.total==null) return '진단 답변 없음';
  return `점수 ${r.total} | `+r.areas.map(x=>`${x.w.name} ${x.s}`).join(', ')+' | 답변: '+
    W.flatMap(w=>w.qs.filter(q=>S.ans[q.id]&&S.ans[q.id]!=='na').map(q=>`${q.t} → ${q.o[S.ans[q.id].i][0]}`)).join(' / ');
}
function openReq(t,exp){
  const c=REQ[t];
  $('#fType').value=t; $('#mT').textContent=c[0]; $('#mS').textContent=c[1];
  $('#expW').style.display=(c[2]||t==='lite'||t==='full')?'':'none'; if(exp&&[...$('#fExp').options].some(o=>o.value===exp)) $('#fExp').value=exp;
  $('#memoL').innerHTML=t==='pro'?'소개 (업체명·경력·활동 지역)':'하고 싶은 말<span class="opt-l">선택</span>';
  document.querySelectorAll('.chipsel input').forEach(c=>{ c.checked=!!(exp&&TOPIC_OF[exp]===c.value); });
  $('#fSum').value=t==='pro'?'(전문가 등록)':summary();
  $('#ok').style.display='none'; $('#modal').classList.add('on');
}
$('#mX').onclick=()=>$('#modal').classList.remove('on');
$('#modal').onclick=e=>{ if(e.target.id==='modal') $('#modal').classList.remove('on'); };
$('#fm').onsubmit=e=>{
  e.preventDefault();
  fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(e.target)).toString()})
   .then(r=>{ if(!r.ok) throw 0; $('#ok').textContent='접수됐습니다. 영업일 기준 1~2일 안에 연락드릴게요.'; e.target.reset(); })
   .catch(()=>{ $('#ok').textContent='전송에 실패했어요. 잠시 후 다시 시도해 주세요.'; })
   .finally(()=>{ $('#ok').style.display='block'; });
};
const tp=document.getElementById('tfgPro'); if(tp) tp.onclick=e=>{e.preventDefault();openReq('pro');};
/* ===== 상담·문의 센터 ===== */
const CS_HOURS = "평일 오전 9시 ~ 오후 6시";   // 운영 시간 (가정 — 실제 시간으로 바꾸세요)

 ['진단은 정말 무료인가요?','네. 30초 간이진단과 결과 보기, 전문가 상담 요청은 모두 무료입니다. 유료는 원하실 때만 신청하는 리포트·보고서입니다.'],
 ['숫자를 정확히 몰라도 되나요?','괜찮습니다. 대략 고르시면 되고, 모르는 문항은 "잘 모르겠어요"로 건너뛰면 그 문항만 빼고 계산합니다.'],
 ['어떤 전문가가 연결되나요?','번식·수의·사양·경영·설비 등 약한 곳에 맞는 분야의 전문가를 찾아 연결합니다. 상담 전 분야와 방식을 먼저 안내드립니다.'],
 ['상세 리포트·보고서는 얼마인가요?','간이 리포트와 정밀 보고서 두 단계로 준비 중이며, 정확한 비용은 신청하시면 연락드려 안내합니다.'],
 ['제 목장 정보는 어떻게 쓰이나요?','진단 답변은 이 기기에만 저장됩니다. 상담을 신청하실 때만 결과가 함께 전달되고, 상담 목적이 끝나면 파기합니다.']];

      <button class="cso" data-cs="call"><span class="ic">📞</span><span class="tx"><b>전화 상담</b><small>${CS_HOURS}</small></span></button>
      <button class="cso" data-cs="form"><span class="ic">📝</span><span class="tx"><b>연락처 남기기</b><small>이름·연락처만 · 30초</small></span></button>
    </div>
    <div class="csflow">
      <div class="csf"><div class="k">A</div><b>문의</b><small>카톡·전화·신청서</small></div><div class="csa">→</div>
      <div class="csf"><div class="k">B</div><b>진단 결과 확인</b><small>약점 파악</small></div><div class="csa">→</div>
      <div class="csf"><div class="k">C ★</div><b>전문가 연결</b><small>분야 맞춤</small></div><div class="csa">→</div>
      <div class="csf"><div class="k">D</div><b>상담·보고서</b><small>개선 계획</small></div><div class="csa">→</div>
      <div class="csf back"><div class="k">다시 A로</div><b>3개월 뒤 재진단</b><small>효과 확인</small></div>
    </div>
    <div class="faq">${FAQS.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')}</div>
  </section>`;
}
document.addEventListener('click',e=>{ const b=e.target.closest('[data-cs]'); if(!b) return;
  const t=b.dataset.cs; if(t==='kakao') kakaoConsult(); else if(t==='call') callConsult(); else openReq('match'); });
/* ===== 카카오톡·전화 상담 — 설정값: 이 두 줄만 바꾸세요 ===== */
const KAKAO_CHANNEL_ID = "";   // 카카오톡 채널 관리자센터의 채널 ID (예: "_AbCdE"). 비어 있으면 상담 신청서로 받습니다
const PHONE_NUMBER     = "";   // 전화 상담 번호 (예: "010-0000-0000")

function buildSummary(){
  const r=compute(), d=new Date().toLocaleDateString('ko-KR');
  if(r.total==null) return ['[Thanks for Giving 상담 문의]','진단 전입니다. 상담 원합니다.',`문의일: ${d}`].join('\n');
  return ['[낙농 간이진단 결과 — 상담 신청]',
    `종합점수: ${r.total}점 (${grade(r.total)})`,
    `영역별: ${r.areas.map(x=>`${x.w.name} ${x.s}점`).join(', ')}`,
    `개선 필요: ${r.weak.slice(0,3).map(x=>`${SHORT[x.q.id]}(${x.a})`).join(', ')||'없음'}`,
    `진단일: ${d}`,'','상세 컨설팅 보고서 상담 원합니다.'].join('\n');
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(_){} ta.remove(); return ok; }
}
function ktoast(msg){ const t=$('#ktoast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }
async function kakaoConsult(withResult){
  const ok=await copyText(buildSummary());
  if(!KAKAO_CHANNEL_ID){ ktoast('카카오톡 채널 연결 준비 중이에요. 상담 신청서로 받을게요.'); setTimeout(()=>openReq('match'),700); return; }
  ktoast(ok?'진단 결과가 복사됐어요. 카톡 창에 붙여넣어 주세요.':'카톡 창에서 진단 결과를 말씀해 주세요.');
  setTimeout(()=>{ window.location.href=`https://pf.kakao.com/${KAKAO_CHANNEL_ID}/chat`; },900);
}
function callConsult(){
  if(!PHONE_NUMBER){ ktoast('전화 상담 번호 준비 중이에요. 연락처를 남겨주시면 전화드릴게요.'); setTimeout(()=>openReq('match'),700); return; }
  window.location.href=`tel:${PHONE_NUMBER.replace(/-/g,'')}`;
}
$('#kfab').onclick=()=>kakaoConsult(false);
$('#home').onclick=()=>{ S.step='home'; render(); };
render();
</script>
</body>
</html>
