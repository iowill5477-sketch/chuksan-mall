<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks for Giving · 우리 목장 간이 진단 · 전문가·제품 연결</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
:root{
  --ink:#1f2421; --sub:#6b6f69; --line:#e6e3dc; --bg:#f4f3ef; --panel:#f7f6f2; --card:#fff;
  --green:#1f9d74; --green2:#e3f1ec; --green3:#0b5a47; --red:#d94545; --red2:#fcebeb;
  --blue:#1d6fc4; --blue2:#e6f1fb; --gold:#d8b25a; --brown:#9a6a12;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.page{max-width:1040px;margin:0 auto;background:#fff;min-height:100vh}

/* 맨 위 Thanks for Giving 배너 (목업) */
.tfg{position:relative;overflow:hidden;background:linear-gradient(100deg,#1e3467 0%,#2b4a85 45%,#6c99cf 100%);color:#fff}
.tfg .in{display:flex;align-items:center;gap:18px;padding:16px 22px 14px}
.tfg img{height:120px;width:auto;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.tfg h1{font-family:"Times New Roman",Georgia,"Nanum Myeongjo",serif;font-weight:400;font-size:44px;color:var(--gold);letter-spacing:.5px;text-shadow:0 0 18px rgba(255,214,120,.35)}
.tfg .sp{position:absolute;border-radius:50%;background:#ffd977;box-shadow:0 0 10px 3px rgba(255,217,119,.6)}
.tfg .lk{position:absolute;top:10px;right:12px;display:flex;gap:6px}
.tfg .lk a{font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.16);padding:5px 10px;border-radius:20px}

.body{padding:22px}
.panel{background:var(--panel);border-radius:20px;padding:22px}
.ptitle{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ptitle h2{font-size:22px;font-weight:600}
.ptitle small{font-size:14px;color:var(--sub)}

/* A·B·C 진단 카드: PC는 가로 한 줄 */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.dc{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;text-align:left;cursor:pointer;transition:.12s}
.dc:hover{border-color:#bfc8c2}
.dc.weak{border:2.5px solid var(--red)}
.dc .top{display:flex;justify-content:space-between;align-items:center}
.dc .lt{background:var(--green2);color:var(--green3);font-weight:700;font-size:16px;padding:2px 10px;border-radius:7px}
.dc .lb{color:var(--sub);font-size:15px}
.dc .v{font-size:36px;font-weight:600;margin:6px 0 4px;letter-spacing:-.5px}
.dc .v.pre{font-size:22px;color:#a3a69f;margin:14px 0 10px}
.dc .bar{height:8px;background:#ebe9e3;border-radius:9px;overflow:hidden}
.dc .bar i{display:block;height:100%;background:var(--green)}
.dc .s{font-size:14px;color:var(--sub);margin-top:10px}
.dc.weak .s{color:var(--red)}
.more{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center;font-size:14px;color:var(--sub)}
.more button{background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:14px}
.more button.done{border-color:var(--green);color:var(--green3)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:16px}
.foot p{font-size:15px;color:var(--sub)}
.cta{background:#1f1f1f;color:#fff;border:0;border-radius:14px;padding:16px 26px;font-size:17px;font-weight:600;white-space:nowrap}
.todo{background:#fff;border:1.5px solid var(--red2);border-left:5px solid var(--red);border-radius:14px;padding:14px 16px;margin-top:14px}
.todo b{font-size:16px}
.todo .why{font-size:14px;color:var(--sub);margin:3px 0 6px}
.todo ol{padding-left:18px;font-size:15px}
.todo .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* 전문가(왼쪽) · 제품(오른쪽) */
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}
.box{border:1.5px solid var(--line);border-radius:20px;padding:20px}
.bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.bh h3{font-size:20px;font-weight:600}
.bh a,.bh button{color:var(--blue);font-size:15px;background:none;border:0}
.tabs{display:flex;gap:7px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.tab{background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:6px 13px;font-size:15px;color:#555}
.tab.on{background:var(--blue2);border-color:var(--blue2);color:var(--blue)}
.it{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line)}
.it:last-of-type{border-bottom:0}
.av{width:46px;height:46px;border-radius:50%;background:var(--blue2);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.av.sq{border-radius:12px;background:#f1efe9;color:#555}
.it .t{flex:1;min-width:0}
.it b{font-size:17px;font-weight:500;display:block}
.it small{font-size:14px;color:var(--sub)}
.rec{background:var(--red2);color:var(--red);font-size:13px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
.go{font-size:13px;font-weight:600;color:var(--green3);background:var(--green2);padding:5px 9px;border-radius:7px;white-space:nowrap}
.ad{display:block;background:#f6f3ec;border-radius:12px;padding:13px 16px;margin:14px 0 4px;font-size:15px;color:#555}
.ad em{font-style:normal;color:var(--brown);font-weight:600}
.empty{padding:16px 2px;font-size:15px;color:var(--sub)}
.empty b{color:var(--ink);font-weight:600}
.wbtn{display:block;width:100%;background:#fff;border:1.5px solid #cfccc4;border-radius:12px;padding:14px;font-size:17px;margin-top:12px}
.sbtn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600}
.sbtn.l{background:#fff;color:var(--ink);border:1.5px solid #cfccc4}

/* 문항 화면 */
.qbox{max-width:620px;margin:0 auto;background:var(--panel);border-radius:20px;padding:24px}
.qbox .tag{font-size:14px;font-weight:700;color:var(--green3)}
.qbar{height:7px;background:#e4e1da;border-radius:9px;margin:10px 0 18px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--green);transition:.25s}
.qbox h2{font-size:23px;font-weight:600;line-height:1.35}
.qbox .help{color:var(--sub);font-size:14px;margin-top:4px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px;font-size:18px;text-align:left}
.opt:hover,.opt.sel{border-color:var(--green);background:var(--green2)}
.opt.na{background:transparent;border-style:dashed;color:var(--sub);font-size:15px}
.qnav{display:flex;justify-content:space-between;margin-top:16px}
.lnk{background:none;border:0;color:var(--sub);font-size:15px;padding:6px}
.toast{background:var(--green2);color:var(--green3);font-weight:600;border-radius:12px;padding:10px 14px;margin-bottom:14px;text-align:center}

.note{font-size:12px;color:var(--sub);margin:22px 0 6px;line-height:1.65}

/* 신청 모달 */
.modal{position:fixed;inset:0;background:rgba(20,25,22,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:20px 20px 0 0;padding:22px;max-width:520px;width:100%;max-height:92vh;overflow:auto}
@media(min-width:700px){.modal{align-items:center}.mbox{border-radius:20px}}
.mbox h3{font-size:19px}
.mbox .s{color:var(--sub);font-size:14px;margin:4px 0 12px}
.mbox label{display:block;font-size:14px;font-weight:700;margin:10px 0 4px}
.mbox input,.mbox select,.mbox textarea{width:100%;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px}
.mbox .agree{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--sub);font-weight:500;margin-top:12px}
.mbox .agree input{width:auto;margin-top:3px}
.mbox .row{display:flex;gap:10px;margin-top:16px}
.mbox .row button{flex:1;border:0;border-radius:11px;padding:13px;font-size:16px;font-weight:700}
.mbox .ok{display:none;margin-top:12px;padding:12px;border-radius:10px;background:var(--green2);color:var(--green3);font-weight:700}
.hide{display:none}

@media(max-width:820px){.cards{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
@media(max-width:520px){.body{padding:16px}.panel{padding:18px}.tfg img{height:92px}.tfg h1{font-size:30px}.tfg .in{gap:12px;padding:14px 14px 10px}
 .foot{flex-direction:row}.foot p{font-size:14px}.cta{padding:14px 18px;font-size:16px}.dc .v{font-size:32px}}
</style>
</head>
<body>
<div class="page">

<div class="tfg">
  <span class="sp" style="width:6px;height:6px;left:44%;top:22%"></span>
  <span class="sp" style="width:4px;height:4px;left:80%;top:15%"></span>
  <span class="sp" style="width:3px;height:3px;left:58%;top:70%;opacity:.7"></span>
  <span class="sp" style="width:5px;height:5px;left:92%;top:55%;opacity:.8"></span>
  <div class="lk"><a href="detail.html">정밀진단</a><a href="../">축산몰</a></div>
  <div class="in"><img src="tfg-logo.png" alt="YULDANG"><h1>Thanks for Giving</h1></div>
</div>

<div class="body" id="view"></div>

</div>

<!-- 신청 모달 (Netlify Forms) -->
<div class="modal" id="modal"><div class="mbox">
  <h3 id="mT">신청</h3><p class="s" id="mS"></p>
  <form id="fm" name="dx-request" method="POST" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="dx-request">
    <input type="hidden" name="type" id="fType">
    <input type="hidden" name="summary" id="fSum">
    <p class="hide"><label>비워두세요<input name="bot-field"></label></p>
    <label>성함 (업체명)</label><input name="name" required>
    <label>연락처</label><input name="phone" type="tel" required placeholder="010-">
    <label>지역</label><input name="region" placeholder="예) 충남 당진">
    <div id="expW"><label>분야</label>
      <select name="expert" id="fExp"><option>번식</option><option>사양</option><option>경영</option><option>환경</option><option>인증</option><option>6차</option><option>사료</option><option>첨가제</option><option>기자재</option></select></div>
    <label id="memoL">하고 싶은 말 (선택)</label><textarea name="memo" rows="3"></textarea>
    <label class="agree"><input type="checkbox" required> 연락을 위해 성함·연락처·진단 결과를 수집하는 데 동의합니다. (목적 달성 후 파기)</label>
    <div class="row"><button type="button" id="mX" style="background:#efede6;color:#555">닫기</button><button style="background:#1f1f1f;color:#fff">보내기</button></div>
    <div class="ok" id="ok"></div>
  </form>
</div></div>

<script>
const W=[
 {id:'quota',ic:'🥛',name:'쿼터·납유',ask:'쿼터가 넘치거나 모자라요',exp:'쿼터·납유 관리',qs:[
   {id:'q1',t:'쿼터 대비 실제 납유량은 어느 정도인가요?',h:'최근 3개월 평균 기준',o:[['95~103% 거의 딱 맞음',100],['90~95% 또는 103~110%',60],['90% 미만 (많이 모자람)',20],['110% 넘음 (많이 넘침)',20]],
    fix:{a:['월별 납유량을 쿼터와 나란히 기록','분만 일정을 조정해 납유량 고르게','쿼터 매입·임대 손익 따져보기'],p:[],why:'쿼터를 못 채우면 놀리는 권리, 넘기면 낮은 단가 원유가 생깁니다.'}},
   {id:'q2',t:'달마다 납유량 차이가 얼마나 나나요?',h:'가장 많은 달과 적은 달 비교',o:[['10% 안쪽으로 고름',100],['10~20% 차이',60],['20% 넘게 들쭉날쭉',20]],
    fix:{a:['분만이 몰리는 달 확인','수정 계획을 달별로 분산','건유 시기 조정'],p:['이표펜'],why:'납유가 들쭉날쭉하면 한쪽 달은 넘치고 다른 달은 모자랍니다.'}},
   {id:'q3',t:'분만이 특정 계절에 몰리나요?',h:'',o:[['1년 내내 고르게',100],['조금 몰림',60],['많이 몰림',20]],
    fix:{a:['분만 달력 만들기','발정 놓친 소부터 수정 일정 정리','번식 전문가와 연간 계획'],p:['이표펜'],why:'분만 쏠림은 납유량 쏠림으로 바로 이어집니다.'}},
   {id:'q4',t:'2027년 음용유·가공유 배정 변경에 대비하고 있나요?',h:'용도별 원유 배정 비율 조정',o:[['내용을 알고 대비 중',100],['들어봤지만 대비는 아직',50],['처음 듣는다',20]],
    fix:{a:['내 목장 음용유·가공유 비율 확인','배정 변경 시 연간 유대 변화 계산','낙협·진흥회 공지 챙기기'],p:[],why:'같은 양을 짜도 용도 배정에 따라 유대가 달라집니다.'}}]},
 {id:'repro',ic:'🐄',name:'번식',ask:'소가 잘 안 붙어요',exp:'번식·인공수정·수정란이식',qs:[
   {id:'r1',t:'평균 분만간격은 어느 정도인가요?',h:'',o:[['13개월 이하',100],['13~14개월',70],['14~15개월',40],['15개월 넘음',10]],
    fix:{a:['분만 후 60일 전후 첫 수정','공태 100일 넘은 소 검진','발정 관찰 기록 시작'],p:['이표펜','보정기'],why:'분만간격이 한 달 늘면 그만큼 착유일과 송아지가 줄어듭니다.'}},
   {id:'r2',t:'분만 후 첫 수정은 보통 언제 하나요?',h:'',o:[['60일 이내',100],['60~90일',60],['90일 넘어서',20]],
    fix:{a:['분만 후 40일 자궁 회복 검진','첫 수정 목표일을 달력에 표시','발정 동기화 프로그램 검토'],p:['보정기'],why:'첫 수정이 늦으면 공태일수가 바로 늘어납니다.'}},
   {id:'r3',t:'발정 관찰은 어떻게 하나요?',h:'',o:[['하루 3번 이상 + 기록',100],['하루 1~2번',50],['거의 못 봄',10]],
    fix:{a:['아침·점심·저녁 20분씩 관찰','발정 표시(꼬리 마커) 활용','발정 탐지기 도입 검토'],p:['이표펜'],why:'발정을 놓치면 21일이 그냥 지나갑니다.'}},
   {id:'r4',t:'3번 넘게 수정해도 안 붙는 소가 얼마나 되나요?',h:'',o:[['10% 미만',100],['10~20%',50],['20% 넘음',15]],
    fix:{a:['반복 수정우 별도 검진','정액 보관·융해 온도 점검','영양(체형점수) 점검'],p:['보정기'],why:'반복 수정우는 정액값과 공태일수를 같이 깎아 먹습니다.'}}]},
 {id:'milk',ic:'🧪',name:'유방염·유질',ask:'유방염·체세포가 걱정돼요',exp:'수의사 (유방염·질병)',qs:[
   {id:'m1',t:'최근 체세포 등급은?',h:'원유 검사 성적표 기준',o:[['1등급 (20만 미만)',100],['2등급',60],['3등급 이하',20]],
    fix:{a:['고체세포 소 찾아 분방 착유','착유 순서: 건강우 → 감염우','건유기 치료 점검'],p:['분방착유','침지컵'],why:'등급이 한 칸 내려가면 유대 단가가 바로 깎입니다.'}},
   {id:'m2',t:'유두 침지(소독)는 어떻게 하나요?',h:'',o:[['착유 전·후 둘 다',100],['착유 후만',60],['안 함',10]],
    fix:{a:['프리딥 30초 후 닦고 착유','포스트딥 유두 끝까지','침지컵 매일 세척'],p:['침지컵','침지 스프레이'],why:'침지는 가장 싸고 효과 큰 유방염 예방입니다.'}},
   {id:'m3',t:'착유 라이너는 제때 바꾸나요?',h:'',o:[['정해진 주기대로',100],['가끔 늦어짐',50],['거의 안 바꿈',10]],
    fix:{a:['라이너 교체일 기록','착유 횟수 기준으로 주기 계산','예비 라이너 미리 확보'],p:['라이너'],why:'낡은 라이너는 유두 끝을 상하게 해 감염을 부릅니다.'}},
   {id:'m4',t:'이번 달 임상 유방염 소는 몇 %인가요?',h:'착유우 중 치료한 소',o:[['2% 미만',100],['2~5%',50],['5% 넘음',15]],
    fix:{a:['유방염 소 기록 → 재발우 판단','원인균 검사 의뢰','깔짚·축사 위생 점검'],p:['여과지','착유 앞치마'],why:'치료비·버리는 우유·도태까지 이어지는 가장 큰 손실입니다.'}}]},
 {id:'feed',ic:'🌾',name:'사료비',ask:'사료비가 너무 많이 들어요',exp:'사양·영양 (TMR·사료)',qs:[
   {id:'f1',t:'유대 대비 사료비(유사비)는?',h:'사료비 ÷ 유대',o:[['55% 이하',100],['55~65%',60],['65% 넘음',20]],

function expertList(wk){

function productList(wk){

  const top=wk?new Set(worstQ(wk.w).fix.p):new Set();

  let items=MALL[S.ptab].slice().sort((a,b)=>(top.has(b)-top.has(a))||(recQ.has(b)-recQ.has(a))).slice(0,4);
  const mall=items.map(q=>`<a class="it" href="../?q=${encodeURIComponent(q)}"><div class="av sq">${(PNAME[q]||[q,'📦'])[1]}</div><div class="t"><b>${(PNAME[q]||[q])[0]}</b><small>축산몰 · 업체별 최저가 비교</small></div>${top.has(q)?`<span class="rec">${(MAIN.find(m=>m[0]===wk.w.id)||[0,'★'])[1]} 추천</span>`:`<span class="go">비교</span>`}</a>`);

    <h2>${q.t}</h2>${q.h?`<p class="help">${q.h}</p>`:''}
    <div class="opts">${q.o.map((o,i)=>`<button class="opt ${a&&a!=='na'&&a.i===i?'sel':''}" data-i="${i}">${o[0]}</button>`).join('')}
      <button class="opt na" data-i="na">잘 모르겠어요 (건너뛰기)</button></div>
    <div class="qnav"><button class="lnk" id="back">← ${S.qi?'이전':'처음으로'}</button><button class="lnk" id="out">결과 보기 →</button></div></div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const i=b.dataset.i; ANS[q.id]=i==='na'?'na':{i:+i,s:q.o[+i][1]}; save(); b.classList.add('sel');
    setTimeout(()=>{
      if(S.qi<w.qs.length-1){ S.qi++; vQ(); return; }
      const nxt=S.chain&&MAIN.map(x=>x[0]).find(id=>!done(WA(id)));
      if(nxt){ S.w=nxt; S.qi=0; vQ(); return; }
      goHome(`${m?m[1]+' '+m[2]:w.name} 진단 완료! 아래 전문가·제품이 결과에 맞춰 정렬됐어요`);
    },160);
  });
  $('#back').onclick=()=>{ if(S.qi){S.qi--;vQ();} else goHome(''); };
  $('#out').onclick=()=>goHome('');
}
function goHome(t){ const wk=weakest(); S.etab=wk?AREA_ETAB[wk.w.id]:S.etab; S.ptab=wk?AREA_PTAB[wk.w.id]:S.ptab; S.toast=t; S.view='home'; render(); window.scrollTo({top:0}); }

/* ===== 신청 ===== */
const REQ={
 match:['무료 전문가 상담 요청','진단 결과를 보고 맞는 전문가를 찾아 연락드립니다.',1],
 lite:['간이 원인분석 리포트 (9,900원 · 가정)','결제 방법과 결과 받는 방법을 연락드려 안내합니다.',0],
 full:['정밀 컨설팅 보고서 (190,000원 · 가정)','필요한 자료(검정성적·납유 명세)와 일정을 안내합니다.',0],
 remind:['3개월 뒤 재진단 알림','3개월 뒤 문자로 재진단 링크를 보내드립니다.',0],
 pro:['전문가·업체 등록','분야와 활동 지역을 남겨주세요. 등록 절차를 안내드립니다.',1],
 ad:['광고 배너 문의','노출 위치·기간·비용을 안내드립니다.',1]
};
function summary(){
  const d=W.filter(done); if(!d.length) return '진단 답변 없음';
  return d.map(w=>`${w.name} ${score(w)}점`).join(', ')+' | '+d.flatMap(w=>w.qs.filter(answered).map(q=>`${SHORT[q.id]}: ${q.o[ANS[q.id].i][0]}`)).join(' / ');
}
function openReq(t,tab){
  const c=REQ[t]; $('#fType').value=t; $('#mT').textContent=c[0]; $('#mS').textContent=c[1];
  $('#expW').style.display=c[2]?'':'none'; if(tab&&[...$('#fExp').options].some(o=>o.value===tab)) $('#fExp').value=tab;
  $('#memoL').textContent=(t==='pro'||t==='ad')?'소개 (업체명·경력·제품·활동 지역)':'하고 싶은 말 (선택)';
  $('#fSum').value=(t==='pro'||t==='ad')?'(등록·광고 문의)':summary();
  $('#ok').style.display='none'; $('#modal').classList.add('on');
}
$('#mX').onclick=()=>$('#modal').classList.remove('on');
$('#modal').onclick=e=>{ if(e.target.id==='modal') $('#modal').classList.remove('on'); };
$('#fm').onsubmit=e=>{
  e.preventDefault();
  fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(e.target)).toString()})
   .then(r=>{ if(!r.ok) throw 0; $('#ok').textContent='접수됐습니다. 영업일 기준 1~2일 안에 연락드릴게요.'; e.target.reset(); })
   .catch(()=>{ $('#ok').textContent='전송에 실패했어요. 잠시 후 다시 시도해 주세요.'; })
   .finally(()=>{ $('#ok').style.display='block'; });
};
render();
</script>
